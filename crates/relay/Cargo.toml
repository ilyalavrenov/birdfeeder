[package]
name = "relay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
guestapi = { path = "../guestapi" }
hex = "0.4.3"
humantime = "2.3.0"
opentelemetry = { version = "0.31.0", default-features = false, features = ["logs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tokio = { version = "1.52.0", features = ["fs", "io-util", "macros", "net", "rt", "time"] }
tokio-util = "0.7.18"
tracing = "0.1.44"

[dev-dependencies]
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["logs", "testing"] }
rstest = "0.26.1"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["test-util"] }

[lints]
workspace = true

[package]
name = "roost-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pbjson = "0.9.0"
prost = "0.14.3"
regex = "1.12.3"
serde = "1.0.228"
thiserror = "2.0.18"
tonic = { version = "0.14.5", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.5"

[dev-dependencies]
rstest = "0.26.1"

[build-dependencies]
prost = "0.14.3"
pbjson-build = "0.9.0"
protox = "0.9.1"
tonic-prost-build = "0.14.5"

# build.rs generates the code that uses these and lib.rs include!s it. cargo-shear can't see inside that.
[package.metadata.cargo-shear]
ignored = ["pbjson", "serde", "tonic-prost"]

[lints]
workspace = true

[package]
name = "fcapigen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
prettyplease = "0.2.37"
# typify takes schemars 0.8's schema types.
schemars = "0.8.22"
serde_json = "1.0.149"
serde_norway = "0.9.42"
syn = "2.0.117"
typify = "0.6.1"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[dev-dependencies]
rstest = "0.26.1"

[lints]
workspace = true

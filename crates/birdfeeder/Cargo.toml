[package]
name = "birdfeeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
digest-io = "0.1.0"
docker_credential = "1.4.0"
flate2 = "1.1.10"
futures-util = { version = "0.3", default-features = false }
hex = "0.4.3"
http = "1.5.0"
humantime = "2.4.0"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
roost-api = { path = "../roost-api" }
ruzstd = "0.9.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tabwriter = "1.4.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "process", "rt", "signal", "time"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
rstest = "0.28.0"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14.9", default-features = false, features = ["server", "router", "codegen"] }

[lints]
workspace = true

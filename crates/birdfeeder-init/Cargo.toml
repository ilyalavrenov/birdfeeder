[package]
name = "birdfeeder-init"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
guestapi = { path = "../guestapi", default-features = false }
humantime = "2.4.0"
libc = "0.2.191"
nix = { version = "0.31.3", features = ["fs", "mount", "poll", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ureq = { version = "3.5.1", default-features = false }

[dev-dependencies]
rstest = "0.28.0"
tempfile = "3.27.0"

[graph]
# what CI and hosts build; a Mac only lints for these.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
# permissive only. CDLA-Permissive-2.0 covers webpki-roots' certificate data.
allow = ["MIT", "Apache-2.0", "ISC", "BSD-3-Clause", "Unicode-3.0", "CDLA-Permissive-2.0", "Zlib"]
# the workspace's own crates aren't published.
private = { ignore = true }

[bans]
# proc-macro crates straddle syn 2 and 3 for now; the duplicate costs build time, not correctness.
multiple-versions = "allow"
wildcards = "deny"
# path dependencies between the workspace's own crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "fcapigen"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
prettyplease = "0.3.0"
# typify takes schemars 0.8's schema types.
schemars = "1.0.0"
serde_json = "1.0.154"
serde_norway = "0.9.42"
syn = "3.0.0"
typify = "0.8.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
rstest = "0.28.0"

[lints]
workspace = true

[package]
name = "guestnet"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
ipnet = { version = "2.12.2", features = ["serde"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.31", default-features = false }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["fs", "mount", "sched", "user"] }
rtnetlink = "0.24.0"

[dev-dependencies]
nix = { version = "0.31.3", features = ["sched", "user"] }
rstest = "0.28.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true

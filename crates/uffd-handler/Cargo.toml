[package]
name = "uffd-handler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
libc = "0.2.191"
memmap2 = "0.9.12"
nix = { version = "0.31.3", features = ["socket", "uio", "event", "fs", "feature", "ioctl", "poll"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
rstest = "0.28.0"
tempfile = "3.27.0"

[package]
name = "vmm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
fcapi = { path = "../fcapi" }
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
libc = "0.2.185"
nix = { version = "0.31.2", features = ["fs", "signal", "process"] }
opentelemetry = { version = "0.31.0", default-features = false, features = ["metrics"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.32.1", default-features = false }

[dev-dependencies]
hyper = { version = "1.9.0", features = ["server"] }
nix = { version = "0.31.2", features = ["sched", "socket", "user"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["metrics", "testing"] }
rstest = "0.26.1"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

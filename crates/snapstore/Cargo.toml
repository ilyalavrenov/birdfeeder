[package]
name = "snapstore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["rt-tokio"] }
# the SDK's default client pulls in aws-lc, and the cross toolchain doesn't need its C build. everything else uses ring.
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-ring"] }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["fs", "rt"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "time"] }
ureq = { version = "3.5.1", default-features = false }

[lints]
workspace = true

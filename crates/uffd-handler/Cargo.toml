[package]
name = "uffd-handler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
humantime = "2.3.0"
libc = "0.2.185"
memmap2 = "0.9.10"
nix = { version = "0.31.2", features = ["socket", "uio", "event", "fs", "feature", "ioctl", "poll"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "json", "std"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"

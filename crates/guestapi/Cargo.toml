[package]
name = "guestapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["client"]
client = ["dep:anyhow", "dep:tokio"]

[dependencies]
anyhow = { version = "1.0.102", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
rstest = "0.26.1"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["macros", "rt"] }

[lints]
workspace = true

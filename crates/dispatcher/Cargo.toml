[package]
name = "dispatcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
http = "1.5.0"
humantime = "2.4.0"
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
roost-api = { path = "../roost-api" }
service = { path = "../service" }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tonic = { version = "0.14.9", default-features = false, features = ["channel", "server", "router"] }
tower-layer = "0.3.3"
tracing = "0.1.44"

[dev-dependencies]
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
rstest = "0.28.0"
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true

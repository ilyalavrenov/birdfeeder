[package]
name = "vmm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
fcapi = { path = "../fcapi" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["fs", "signal", "process"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }

[dev-dependencies]
hyper = { version = "1.12.0", features = ["server"] }
nix = { version = "0.31.3", features = ["sched", "socket", "user"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "testing"] }
rstest = "0.28.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true

name: validate

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'integration') && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event.action != 'labeled' || github.event.label.name == 'integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAVY: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'integration') }}
      MISE_RUSTUP_HOME: /home/runner/.local/share/mise/rustup
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NEXTEST_PROFILE: ci
      RUST_BACKTRACE: "1"
      RUST_LIB_BACKTRACE: "0"
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflows:
              - '.github/**'
      - if: github.event_name != 'pull_request' || steps.changes.outputs.workflows == 'true'
        uses: reviewdog/action-actionlint@a7d35aaf8c309203a4ae861d32b7bd490baa7bf3 # v1.83.0
        with:
          reporter: github-check
          filter_mode: nofilter
          fail_level: error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request' || steps.changes.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "v2026.11.2"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-directories: ~/.cargo/advisory-dbs
          save-if: ${{ github.event_name == 'push' }}
      - run: du -h -d 2 target ~/.cargo/registry | sort -h | tail -n 12
      - run: mise run check
      - name: check generated code
        run: |
          mise run generate
          git diff --exit-code
      - run: mise run test
      - if: env.HEAVY == 'true'
        run: |
          sudo systemctl stop docker.socket docker.service
          sudo iptables -P FORWARD ACCEPT
      - if: env.HEAVY == 'true'
        run: sudo env PATH="$PATH" bash scripts/setup-linux.sh
      - if: env.HEAVY == 'true'
        run: mise run test integration
      - if: env.HEAVY == 'true'
        run: mise run test smoke
      - if: failure() && env.HEAVY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/smoke-logs"
          sudo find /var/lib/birdfeeder/smoke.* /run/birdfeeder-smoke.* -type f -name '*.log*' \
            -exec cp --parents {} "$RUNNER_TEMP/smoke-logs" \; 2>/dev/null || true
          sudo iptables -S FORWARD
          sudo nft list ruleset | tee "$RUNNER_TEMP/smoke-logs/nft-ruleset.txt" > /dev/null
          sudo chown -R "$USER" "$RUNNER_TEMP/smoke-logs"
      - if: failure() && env.HEAVY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: ${{ runner.temp }}/smoke-logs
          if-no-files-found: ignore
      - if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          report_paths: target/nextest/reports/*.xml
          check_name: rust tests
          require_tests: true
          detailed_summary: true
          include_time_in_summary: true

[package]
name = "birdfeeder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.1", features = ["derive"] }
digest-io = "0.1.0"
docker_credential = "1.3.2"
flate2 = "1.1.9"
futures-util = { version = "0.3.32", default-features = false }
hex = "0.4.3"
http = "1.4.0"
humantime = "2.3.0"
oci-client = { version = "0.16.1", default-features = false, features = ["rustls-tls"] }
roost-api = { path = "../roost-api" }
ruzstd = "0.8.2"
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tabwriter = "1.4.1"
tar = "0.4.45"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.0", features = ["fs", "macros", "process", "rt", "signal", "time"] }
tonic = { version = "0.14.5", default-features = false, features = ["channel", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
rstest = "0.26.1"
tokio = { version = "1.52.0", features = ["net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14.5", default-features = false, features = ["server", "router", "codegen"] }

[lints]
workspace = true

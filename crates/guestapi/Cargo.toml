[package]
name = "guestapi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["client"]
client = ["dep:anyhow", "dep:tokio"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "time"], optional = true }

[dev-dependencies]
rstest = "0.28.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true

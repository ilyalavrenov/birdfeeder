[package]
name = "roost"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
guestapi = { path = "../guestapi" }
guestnet = { path = "../guestnet" }
hex = "0.4.3"
ipnet = { version = "2.12.2", features = ["serde"] }
nix = { version = "0.31.3", features = ["fs", "hostname", "user"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "logs"] }
relay = { path = "../relay" }
roost-api = { path = "../roost-api" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
service = { path = "../service" }
sha2 = "0.11.1"
snapstore = { path = "../snapstore" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tonic = { version = "0.14.9", default-features = false, features = ["server", "router"] }
tracing = "0.1.44"
vmm = { path = "../vmm" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
fcapi = { path = "../fcapi" }
rstest = "0.28.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
